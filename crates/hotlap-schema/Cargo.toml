[package]
name = "hotlap-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared data types for Hotlap (normalized F1 telemetry state + wire protocol)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[features]
# Enables the JSON Schema export binary (used to generate the web's TS types).
schema-gen = []

[[bin]]
name = "export-schema"
path = "src/bin/export_schema.rs"
required-features = ["schema-gen"]
